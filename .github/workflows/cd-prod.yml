name: CD Pipeline - Branche Prod

on:
  push:
    branches:
      - prod

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Scan de sécurité avant déploiement
  # ─────────────────────────────────────────────
  security-scan:
    name: Scan Sécurité (Prod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull de l'image depuis Docker Hub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Installer Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan vulnérabilités - BLOQUANT si CRITICAL
        run: |
          trivy image --exit-code 1 \
            --severity CRITICAL \
            --format table \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

  # ─────────────────────────────────────────────
  # JOB 2 : Déploiement sur runner_prod (port 80)
  # ─────────────────────────────────────────────
  deploy:
    name: Déploiement sur runner_prod
    runs-on: runner_prod
    needs: security-scan

    steps:
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Arrêter et supprimer le conteneur existant
        run: |
          docker stop intranet-newdeal || true
          docker rm intranet-newdeal || true

      - name: Pull de la dernière image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Déployer le conteneur sur le port 80
        run: |
          docker run -d \
            --name intranet-newdeal \
            --restart unless-stopped \
            -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Vérifier que le conteneur tourne
        run: |
          sleep 5
          docker ps | grep intranet-newdeal
          echo "✅ Déploiement réussi sur le port 80"

  # ─────────────────────────────────────────────
  # JOB 3 : Notification email
  # ─────────────────────────────────────────────
  notify:
    name: Notification Email
    runs-on: ubuntu-latest
    needs: [security-scan, deploy]
    if: always()

    steps:
      - name: Envoyer email de notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: |
            [Intranet NewDeal] Déploiement ${{ needs.deploy.result == 'success' && '✅ RÉUSSI' || '❌ ÉCHOUÉ' }} - ${{ github.sha }}
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Bonjour,

            Le pipeline CD de l'Intranet NewDeal vient de se terminer.

            📋 Résultat du déploiement : ${{ needs.deploy.result }}
            🔐 Résultat du scan sécurité : ${{ needs.security-scan.result }}

            🔖 Commit  : ${{ github.sha }}
            👤 Auteur  : ${{ github.actor }}
            📅 Date    : ${{ github.event.head_commit.timestamp }}
            🌿 Branche : ${{ github.ref_name }}

            Cordialement,
            Pipeline CI/CD – Intranet Gouvernemental Sénégal