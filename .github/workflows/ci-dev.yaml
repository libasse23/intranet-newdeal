name: CI Pipeline - Branche Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build Image Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-${{ github.sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Sauvegarder l'image en artifact
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest \
            -o intranet-image.tar

      - name: Upload de l'image en artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: intranet-image.tar
          retention-days: 1

  security-scan:
    name: Scan Sécurité
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Télécharger l'image Docker depuis artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i intranet-image.tar

      - name: Installer Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan des vulnérabilités LOW/MEDIUM/HIGH
        run: |
          trivy image --exit-code 0 \
            --severity LOW,MEDIUM,HIGH \
            --format table \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Bloquer si vulnérabilité CRITICAL
        run: |
          trivy image --exit-code 1 \
            --severity CRITICAL \
            --format table \
            ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Installer Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Scan des secrets (Gitleaks)
        run: |
          gitleaks detect --source . --verbose --no-git || true

  push:
    name: Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Télécharger l'image Docker depuis artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i intranet-image.tar

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest

      - name: Résumé du build
        run: |
          echo "✅ Image pushée avec succès !"
          echo "🐳 Image : ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev-latest"
          echo "🔖 SHA   : ${{ github.sha }}"

  notify:
    name: Notification Email
    runs-on: ubuntu-latest
    needs: [build, security-scan, push]
    if: always()
    continue-on-error: true

    steps:
      - name: Envoyer email de notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Intranet NewDeal] Pipeline Dev - ${{ needs.push.result == 'success' && '✅ SUCCÈS' || '❌ ÉCHEC' }}"
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Bonjour,

            Rapport pipeline CI (branche dev) :

            📦 Build     : ${{ needs.build.result }}
            🔐 Scan sécu : ${{ needs.security-scan.result }}
            🚀 Push Hub  : ${{ needs.push.result }}

            🔖 Commit  : ${{ github.sha }}
            👤 Auteur  : ${{ github.actor }}
            🌿 Branche : ${{ github.ref_name }}

            Cordialement,
            Pipeline CI/CD – Intranet Gouvernemental Sénégal 🇸🇳